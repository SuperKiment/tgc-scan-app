# Builds and signs the release APKs (one per ABI, no universal APK) and attaches them to a release.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   TCGSCAN_KEYSTORE_B64       base64 of the release keystore (decoded to a temporary file and
#                              exported as TCGSCAN_KEYSTORE_FILE)
#   TCGSCAN_KEYSTORE_PASSWORD  keystore password   -> TCGSCAN_KEYSTORE_PASSWORD
#   TCGSCAN_KEY_ALIAS          key alias           -> TCGSCAN_KEY_ALIAS
#   TCGSCAN_KEY_PASSWORD       key password        -> TCGSCAN_KEY_PASSWORD
# The build falls back to the debug keystore when any of them is missing, so the job fails early
# instead of publishing a debug-signed APK.
#
# Trigger: push of a `v*` tag, or manual dispatch with the tag to create/update.
# The release is never marked latest: the app resolves language packs through
# releases/latest/download/, which must keep pointing at the packs-<date> release (packs.yml).
name: release-apk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Fetch ONNX models
        run: bash tools/fetch_models.sh

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.TCGSCAN_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::secret TCGSCAN_KEYSTORE_B64 is not set"
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          echo "TCGSCAN_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: FOSS and permission audit
        run: bash tools/check-foss.sh

      - name: Build signed release APKs
        env:
          TCGSCAN_KEYSTORE_PASSWORD: ${{ secrets.TCGSCAN_KEYSTORE_PASSWORD }}
          TCGSCAN_KEY_ALIAS: ${{ secrets.TCGSCAN_KEY_ALIAS }}
          TCGSCAN_KEY_PASSWORD: ${{ secrets.TCGSCAN_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Attach APKs to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: app/build/outputs/apk/release/*.apk
          make_latest: "false"
          fail_on_unmatched_files: true
